# HA-FLOORPLAN UPGRADE CONFIG
# ════════════════════════════════════════════════════════════════════════════
#
# This gives you the color-synced room effect shown in:
# https://community.home-assistant.io/t/floorplan-ui-with-color-synced-lights/169417
#
# INSTALL:
#   1. HACS → Frontend → search "Floorplan" → Install
#      (ExperienceLovelace/ha-floorplan)
#   2. Restart Home Assistant
#   3. Replace the `picture-elements` card in 08_floorplan.yaml with
#      the card definition below
#   4. Keep all the entity overlays from the existing YAML — just change
#      the card type and add the `config` block
#
# HOW IT WORKS:
#   Each room SVG element (e.g. id="living-room") maps to an entity.
#   When the switch is ON → room fills with a warm glow color.
#   When OFF → room returns to its default dim fill.
#   Temperature values can also drive color (cold=blue → warm=orange).
#
# ════════════════════════════════════════════════════════════════════════════

