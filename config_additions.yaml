# Add the sections below to your existing configuration.yaml


# ── 4th Waze Travel Time (Home → Chris's House) ──────────────────────────────
# Add this to your existing sensor: section, or create one if needed.
# Replace the origin/destination addresses with actual ones.
#
# sensor:
#   - platform: waze_travel_time
#     name: "Home to Chris"
#     origin: zone.home
#     destination: "Chris's Address, City, State"    # ← fill in
#     region: "US"
#
# After adding, the entity will be: sensor.home_to_chris


# ── Presence Tracking (Krissy & Jake) ───────────────────────────────────────
# Jake is already tracked via person.jake (Samsung Galaxy).
# To add Krissy:
#   1. Install the HA Companion App on Krissy's phone
#   2. Log in with a separate HA account (or share Jake's — but separate is better)
#   3. A new device_tracker will appear automatically
#   4. Go to Settings → People → Add Person → Krissy
#   5. Link her device tracker to that person
#
# For Theo: since he's a baby, just derive presence:
#   Theo is home = Jake OR Krissy is home
#   No separate tracking needed.

# ── Person Config (add after adding Krissy's device) ────────────────────────
# homeassistant:
#   customize:
#     person.krissy:
#       friendly_name: Krissy

# ── Nanit Baby Monitor ───────────────────────────────────────────────────────
# There is a HACS integration for Nanit: search "Nanit" in HACS → Integrations
# It can expose:
#   - camera stream from the Nanit
#   - sound level sensor
#   - breathing rate (Nanit Pro only)
# Once installed, the camera entity will appear as camera.nanit_XXXX
# Add it to the nursery dashboard's camera section.


