title: Garden
views:
  - title: Garden
    path: garden
    type: sections
    max_columns: 3
    sections:

      # ── Status Bar ───────────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:weather-rainy
                icon_color: >
                  {{ 'blue' if is_state('sensor.backyard_backyard_rain_sensor_tripped', 'True') else 'grey' }}
                content: >
                  {{ 'Rain Sensor Active' if is_state('sensor.backyard_backyard_rain_sensor_tripped', 'True') else 'No Rain' }}
              - type: template
                icon: mdi:pause-circle
                icon_color: >
                  {{ 'orange' if is_state('sensor.backyard_backyard_paused', 'True') else 'grey' }}
                content: >
                  {{ 'Irrigation Paused' if is_state('sensor.backyard_backyard_paused', 'True') else 'Irrigation Active' }}
              - type: entity
                entity: sensor.backyard_backyard_connection
                icon: mdi:cloud-check
              - type: template
                icon: mdi:battery-alert
                icon_color: red
                content: "Front Underground: REPLACE BATTERY"

      # ── Backyard Zones ───────────────────────────────────────────────────────
      - type: grid
        title: Backyard Sprinklers
        column_span: 1
        cards:
          - type: tile
            entity: switch.backyard_sprinklers_1_zone
            name: Backyard Zone 1
            icon: mdi:sprinkler
          - type: tile
            entity: sensor.backyard_sprinklers_1_status
            name: Zone 1 Status
            icon: mdi:information
          - type: custom:mushroom-template-card
            primary: Zone 1 Last Watered
            secondary: >
              {% set t = states('sensor.backyard_sprinklers_1_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: blue

          - type: tile
            entity: switch.backyard_perimeter_sprinklers_2_zone
            name: Backyard Perimeter 2
            icon: mdi:sprinkler
          - type: tile
            entity: sensor.backyard_perimeter_sprinklers_2_status
            name: Perimeter 2 Status
            icon: mdi:information
          - type: custom:mushroom-template-card
            primary: Perimeter 2 Last Watered
            secondary: >
              {% set t = states('sensor.backyard_perimeter_sprinklers_2_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: blue

          - type: tile
            entity: switch.backyard_perimeter_3_zone
            name: Backyard Perimeter 3
            icon: mdi:sprinkler
          - type: tile
            entity: sensor.backyard_perimeter_3_status
            name: Perimeter 3 Status
            icon: mdi:information
          - type: custom:mushroom-template-card
            primary: Perimeter 3 Last Watered
            secondary: >
              {% set t = states('sensor.backyard_perimeter_3_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: blue

          - type: tile
            entity: switch.backyard_backyard_standby
            name: Backyard Standby Mode
            icon: mdi:power-standby
          - type: tile
            entity: switch.backyard_rain_delay_duration
            name: Rain Delay
            icon: mdi:weather-rainy

      # ── Hose Timers ──────────────────────────────────────────────────────────
      - type: grid
        title: Hose Timers
        column_span: 1
        cards:
          - type: tile
            entity: switch.hose_timers_front_underground_zone
            name: Front Underground
            icon: mdi:pipe
          - type: custom:mushroom-template-card
            primary: Front Underground
            secondary: >
              {% set t = states('sensor.hose_timers_front_underground_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                Last: {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: >
              {{ 'red' if is_state('sensor.hose_timers_front_underground_battery', 'REPLACE') else 'blue' }}
          - type: custom:mushroom-template-card
            primary: "⚠️ Front Underground Battery"
            secondary: "{{ states('sensor.hose_timers_front_underground_battery') }} — replace this battery"
            icon: mdi:battery-alert
            icon_color: red

          - type: tile
            entity: switch.hose_timers_front_overground_zone
            name: Front Overground
            icon: mdi:sprinkler-variant
          - type: custom:mushroom-template-card
            primary: Front Overground
            secondary: >
              {% set t = states('sensor.hose_timers_front_overground_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                Last: {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: blue
          - type: tile
            entity: sensor.hose_timers_front_overground_battery
            name: Overground Battery
            icon: mdi:battery

          - type: tile
            entity: switch.hose_timers_zone_vego_raised_bed
            name: Vego Raised Bed
            icon: mdi:sprout
          - type: custom:mushroom-template-card
            primary: Vego Raised Bed
            secondary: >
              {% set t = states('sensor.hose_timers_vego_raised_bed_last_watered') %}
              {% if t not in ['unknown', 'unavailable'] %}
                Last: {{ as_timestamp(t) | timestamp_custom('%b %d at %-I:%M %p') }}
              {% else %}Unknown{% endif %}
            icon: mdi:clock-outline
            icon_color: green
          - type: tile
            entity: sensor.hose_timers_vego_raised_bed_battery
            name: Raised Bed Battery
            icon: mdi:battery

      # ── Schedule Calendar ────────────────────────────────────────────────────
      - type: grid
        title: Watering Schedule
        column_span: 1
        cards:
          - type: calendar
            entities:
              - entity: calendar.hose_timers_schedule
                color: blue
              - entity: calendar.plant_schedule
                color: green
            title: Irrigation Calendar

      # ── Patio Conditions ─────────────────────────────────────────────────────
      - type: grid
        title: Outdoor Conditions
        column_span: 1
        cards:
          - type: tile
            entity: sensor.patiotempsonoff_temperature
            name: Patio Temp
            icon: mdi:thermometer
          - type: tile
            entity: sensor.patiotempsonoff_humidity
            name: Patio Humidity
            icon: mdi:water-percent
          - type: tile
            entity: sensor.average_outdoor_temperature
            name: Avg Outdoor Temp
            icon: mdi:thermometer-high
          - type: tile
            entity: sensor.backyard_backyard_rain_sensor_tripped
            name: Rain Sensor
            icon: mdi:weather-rainy
          - type: tile
            entity: sensor.backyard_backyard_api_calls_remaining
            name: API Calls Left
            icon: mdi:api
          - type: tile
            entity: sensor.hose_timers_hose_timers_api_calls_remaining
            name: Timer API Calls Left
            icon: mdi:api
