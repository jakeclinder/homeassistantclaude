# ════════════════════════════════════════════════════════════════════════════
# FLOORPLAN DASHBOARD  —  ha-floorplan edition
# ════════════════════════════════════════════════════════════════════════════
#
# Requires (all via HACS):
#   • ha-floorplan  (ExperienceLovelace/ha-floorplan)  ← already installed
#   • card-mod      (optional, only needed for lock/alarm labels)
#
# Files on HA instance  (/config/www/):
#   • floorplan.svg        ← the floor plan drawing
#   • floorplan.css        ← smooth transition styles
#
# POSITIONING / TWEAKS:
#   Entity dots and temp badges are SVG elements in floorplan.svg.
#   Move them by editing their cx/cy (circles) or x/y (rects/text) values.
#   Room fills are driven entirely by the ha-floorplan rules below.
#
# ════════════════════════════════════════════════════════════════════════════

title: Floorplan
views:
  - title: Floorplan
    path: floorplan
    panel: true
    cards:
      - type: custom:floorplan-card
        full_height: true
        config:
          image: /local/floorplan.svg
          stylesheet: /local/floorplan.css
          log_level: error

          rules:

            # ══════════════════════════════════════════════════════════
            # ROOM FILLS  —  color-synced to entity states
            # Each room SVG element fades between its resting color
            # and a bright glow when the relevant switch is ON.
            # ══════════════════════════════════════════════════════════

            # ── Music Room ───────────────────────────────────────────
            - name: Music Room fill
              entities:
                - entity: switch.musiccompandaudiostuff
                  element: music-room
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: music-room
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(249,226,175,0.50)'
                      : 'rgba(249,226,175,0.18)'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 16px rgba(249,226,175,0.65))'
                      : 'none'};

            # ── Music Room switch dot ─────────────────────────────────
            - name: Music dot
              entities:
                - entity: switch.musiccompandaudiostuff
                  element: dot-music
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-music
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(249,226,175,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke: #f9e2af;
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 6px rgba(249,226,175,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.musiccompandaudiostuff

            # ── Living Room ───────────────────────────────────────────
            - name: Living Room fill
              entities:
                - entity: switch.clock_wall_grow_light
                  element: living-room
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: living-room
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.38)'
                      : 'rgba(137,180,250,0.15)'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 18px rgba(166,227,161,0.60))'
                      : 'none'};

            - name: Clock wall dot
              entities:
                - entity: switch.clock_wall_grow_light
                  element: dot-clock-wall
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-clock-wall
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke: #a6e3a1;
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 6px rgba(166,227,161,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.clock_wall_grow_light

            # ── Hallway ───────────────────────────────────────────────
            - name: Hallway fill
              entities:
                - entity: switch.living_room_hallway_plant_light
                  element: hallway
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: hallway
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.32)'
                      : 'rgba(166,173,200,0.10)'};

            - name: Hallway plant dot
              entities:
                - entity: switch.living_room_hallway_plant_light
                  element: dot-hallway-plant
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-hallway-plant
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 5px rgba(166,227,161,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.living_room_hallway_plant_light

            # ── Kitchen ───────────────────────────────────────────────
            - name: Kitchen fill
              entities:
                - entity: switch.kitchen_bench_grow_light
                  element: kitchen
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: kitchen
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.38)'
                      : 'rgba(250,179,135,0.18)'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 14px rgba(166,227,161,0.55))'
                      : 'none'};

            - name: Kitchen grow dot
              entities:
                - entity: switch.kitchen_bench_grow_light
                  element: dot-kitchen-grow
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-kitchen-grow
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 6px rgba(166,227,161,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.kitchen_bench_grow_light

            # ── Master Bedroom ────────────────────────────────────────
            # Room glows if EITHER grow light OR PC is on
            - name: Master Bedroom fill
              entities:
                - entity: switch.krissy_bedside_grow_light
                  element: master-bedroom
                - entity: switch.krissy_pc_power_guarded
                  element: master-bedroom
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: master-bedroom
                  style: >
                    ${(entities['switch.krissy_bedside_grow_light'].state === 'on' ||
                       entities['switch.krissy_pc_power_guarded'].state  === 'on')
                      ? 'fill: rgba(166,227,161,0.35); filter: drop-shadow(0 0 14px rgba(166,227,161,0.55));'
                      : 'fill: rgba(137,180,250,0.18); filter: none;'}

            - name: Krissy PC dot
              entities:
                - entity: switch.krissy_pc_power_guarded
                  element: dot-krissy-pc
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-krissy-pc
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(137,180,250,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 6px rgba(137,180,250,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.krissy_pc_power_guarded

            - name: Bedside grow dot
              entities:
                - entity: switch.krissy_bedside_grow_light
                  element: dot-bedside-grow
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-bedside-grow
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(166,227,161,0.30)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 6px rgba(166,227,161,0.9))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.krissy_bedside_grow_light

            # ── Back Patio ────────────────────────────────────────────
            - name: Back Patio fill
              entities:
                - entity: switch.patio_light_switch
                  element: back-patio
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: back-patio
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(249,226,175,0.28)'
                      : 'rgba(166,227,161,0.10)'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 20px rgba(249,226,175,0.50))'
                      : 'none'};

            - name: Patio light dot
              entities:
                - entity: switch.patio_light_switch
                  element: dot-patio-light
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-patio-light
                  style: >
                    fill: ${entity.state === 'on'
                      ? 'rgba(249,226,175,0.35)'
                      : 'rgba(17,17,27,0.90)'};
                    stroke: #f9e2af;
                    stroke-opacity: ${entity.state === 'on' ? '1' : '0.35'};
                    filter: ${entity.state === 'on'
                      ? 'drop-shadow(0 0 8px rgba(249,226,175,1.0))'
                      : 'none'};
              tap_action:
                action: call-service
                service: switch.toggle
                service_data:
                  entity_id: switch.patio_light_switch

            # ══════════════════════════════════════════════════════════
            # TEMPERATURE LABELS  —  live readings in SVG text nodes
            # ══════════════════════════════════════════════════════════

            - name: Nursery temp text
              entities:
                - entity: sensor.nursery_temp_temperature
                  element: text-nursery-temp
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-nursery-temp
                  text: "${parseFloat(entity.state).toFixed(1)}°"

            - name: Avg indoor temp text
              entities:
                - entity: sensor.avg_indoor_temp
                  element: text-avg-indoor
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-avg-indoor
                  text: "avg ${parseFloat(entity.state).toFixed(1)}°"

            - name: Patio temp text
              entities:
                - entity: sensor.patiotempsonoff_temperature
                  element: text-patio-temp
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-patio-temp
                  text: "patio ${parseFloat(entity.state).toFixed(1)}°"

            - name: Front door temp text
              entities:
                - entity: sensor.frontdoortempsonoff_temperature
                  element: text-entry-temp
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-entry-temp
                  text: "door ${parseFloat(entity.state).toFixed(1)}°"

            - name: Garage freezer temp text
              entities:
                - entity: sensor.garagefreezer_temp_temperature
                  element: text-garage-freezer
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-garage-freezer
                  text: "frz ${parseFloat(entity.state).toFixed(1)}°"

            - name: Kitchen main freezer temp text
              entities:
                - entity: sensor.mainfreezer_temp_temperature
                  element: text-kitchen-freezer
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-kitchen-freezer
                  text: "frz ${parseFloat(entity.state).toFixed(1)}°"

            - name: Outdoor avg temp text
              entities:
                - entity: sensor.average_outdoor_temperature
                  element: text-outdoor-avg
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data:
                  element: text-outdoor-avg
                  text: "out ${parseFloat(entity.state).toFixed(1)}°"

            # ── Nursery temperature → room color (cold/comfortable/warm)
            - name: Nursery temp color
              entities:
                - entity: sensor.nursery_temp_temperature
                  element: nursery
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: nursery
                  style: >
                    ${(() => {
                      const t = parseFloat(entity.state);
                      if (t < 65) return 'fill: rgba(137,180,250,0.40);';
                      if (t > 75) return 'fill: rgba(250,179,135,0.38);';
                      return 'fill: rgba(166,227,161,0.30);';
                    })()}

            # ══════════════════════════════════════════════════════════
            # LOCK STATUS  —  green = locked, red = unlocked
            # ══════════════════════════════════════════════════════════

            - name: Lock 1 status
              entities:
                - entity: lock.front_door
                  element: dot-lock-1
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-lock-1
                  style: >
                    fill: ${entity.state === 'locked'
                      ? 'rgba(166,227,161,0.35)'
                      : 'rgba(243,139,168,0.45)'};
                    stroke: ${entity.state === 'locked' ? '#a6e3a1' : '#f38ba8'};
                    stroke-opacity: 1;
                    filter: ${entity.state !== 'locked'
                      ? 'drop-shadow(0 0 6px rgba(243,139,168,0.8))'
                      : 'none'};
              tap_action:
                action: call-service
                service: lock.toggle
                service_data:
                  entity_id: lock.front_door

            - name: Lock 2 status
              entities:
                - entity: lock.front_door_2
                  element: dot-lock-2
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-lock-2
                  style: >
                    fill: ${entity.state === 'locked'
                      ? 'rgba(166,227,161,0.35)'
                      : 'rgba(243,139,168,0.45)'};
                    stroke: ${entity.state === 'locked' ? '#a6e3a1' : '#f38ba8'};
                    stroke-opacity: 1;
                    filter: ${entity.state !== 'locked'
                      ? 'drop-shadow(0 0 6px rgba(243,139,168,0.8))'
                      : 'none'};
              tap_action:
                action: call-service
                service: lock.toggle
                service_data:
                  entity_id: lock.front_door_2

            # ══════════════════════════════════════════════════════════
            # ALARM STATUS  —  green = disarmed, red = armed/alert
            # ══════════════════════════════════════════════════════════

            - name: Alarm status
              entities:
                - entity: alarm_control_panel.blink_marathon
                  element: dot-alarm
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-alarm
                  style: >
                    ${(() => {
                      const s = entity.state;
                      if (s === 'disarmed')
                        return 'fill: rgba(166,227,161,0.30); stroke: #a6e3a1; stroke-opacity: 1; filter: none;';
                      if (s === 'armed_away')
                        return 'fill: rgba(243,139,168,0.40); stroke: #f38ba8; stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(243,139,168,0.8));';
                      return 'fill: rgba(250,179,135,0.40); stroke: #fab387; stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(250,179,135,0.7));';
                    })()}

            # Entryway fill: pulses red if alarm is armed or if door is unlocked
            - name: Entryway fill
              entities:
                - entity: alarm_control_panel.blink_marathon
                  element: entryway
                - entity: lock.front_door
                  element: entryway
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: entryway
                  style: >
                    ${(() => {
                      const alarm = entities['alarm_control_panel.blink_marathon'].state;
                      const lock  = entities['lock.front_door'].state;
                      if (alarm === 'armed_away')
                        return 'fill: rgba(243,139,168,0.30); filter: drop-shadow(0 0 10px rgba(243,139,168,0.6));';
                      if (lock !== 'locked')
                        return 'fill: rgba(250,179,135,0.30); filter: drop-shadow(0 0 8px rgba(250,179,135,0.5));';
                      return 'fill: rgba(250,179,135,0.18); filter: none;';
                    })()}

            # ══════════════════════════════════════════════════════════
            # VACUUM STATUS  —  color shows cleaning/docked/error
            # ══════════════════════════════════════════════════════════

            - name: Vacuum status
              entities:
                - entity: vacuum.q5_max
                  element: dot-vacuum
              state_action:
                action: call-service
                service: floorplan.style_set
                service_data:
                  element: dot-vacuum
                  style: >
                    ${(() => {
                      const s = entity.state;
                      if (s === 'cleaning')
                        return 'fill: rgba(203,166,247,0.35); stroke: #cba6f7; stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(203,166,247,0.8));';
                      if (s === 'docked' || s === 'idle')
                        return 'fill: rgba(17,17,27,0.90); stroke: #cba6f7; stroke-opacity: 0.4; filter: none;';
                      if (s === 'error')
                        return 'fill: rgba(243,139,168,0.35); stroke: #f38ba8; stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(243,139,168,0.7));';
                      return 'fill: rgba(17,17,27,0.90); stroke: #cba6f7; stroke-opacity: 0.3; filter: none;';
                    })()}
              tap_action:
                action: call-service
                service: vacuum.start
                service_data:
                  entity_id: vacuum.q5_max
