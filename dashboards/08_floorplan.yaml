# ════════════════════════════════════════════════════════════════════════════
# FLOORPLAN DASHBOARD  (v2 — based on Planner5D layout)
# ════════════════════════════════════════════════════════════════════════════
#
# SETUP:
#   Copy www/floorplan.svg → /config/www/floorplan.svg on your HA instance
#   (accessible as /local/floorplan.svg)
#
# POSITIONING:
#   SVG is 1200 × 960.  left = (x / 1200) * 100   top = (y / 960) * 100
#   Adjust any element by changing its top/left percentages.
#
# UPGRADE → color-synced rooms (like the community link):
#   1. Install "Floorplan" via HACS → Frontend
#      https://github.com/ExperienceLovelace/ha-floorplan
#   2. Every room in floorplan.svg already has an id attribute ready to use
#      (id="living-room", id="kitchen", id="master-bedroom", etc.)
#   3. See www/ha-floorplan-config.yaml for a ready-to-use upgrade config
#
# ════════════════════════════════════════════════════════════════════════════

title: Floorplan
views:
  - title: Floorplan
    path: floorplan
    panel: true   # fills full viewport — great for wall-mounted iPad
    cards:
      - type: picture-elements
        image: /local/floorplan.svg

        elements:

          # ══════════════════════════════════════════════════════════════
          # TEMPERATURES  — colored chips, no interaction
          # ══════════════════════════════════════════════════════════════

          # ── Nursery ───────────────────────────────────────────────────
          - type: state-label
            entity: sensor.nursery_temp_temperature
            suffix: "°"
            style:
              top: 39%
              left: 33%
              background: "rgba(166,227,161,0.15)"
              color: "#a6e3a1"
              border: "1px solid rgba(166,227,161,0.45)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "14px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ── Entryway / Front Door ────────────────────────────────────
          - type: state-label
            entity: sensor.frontdoortempsonoff_temperature
            suffix: "°"
            style:
              top: 86%
              left: 45%
              background: "rgba(250,179,135,0.15)"
              color: "#fab387"
              border: "1px solid rgba(250,179,135,0.45)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "14px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ── Back Patio ───────────────────────────────────────────────
          - type: state-label
            entity: sensor.patiotempsonoff_temperature
            prefix: "Patio "
            suffix: "°"
            style:
              top: 17%
              left: 57%
              background: "rgba(166,227,161,0.12)"
              color: "#a6e3a1"
              border: "1px solid rgba(166,227,161,0.35)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "13px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ── Average Outdoor (front yard) ──────────────────────────────
          - type: state-label
            entity: sensor.average_outdoor_temperature
            prefix: "Outdoor "
            suffix: "°"
            style:
              top: 88%
              left: 21%
              background: "rgba(166,227,161,0.10)"
              color: "#a6e3a1"
              border: "1px solid rgba(166,227,161,0.30)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "12px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ── Garage Freezer ────────────────────────────────────────────
          - type: state-label
            entity: sensor.garagefreezer_temp_temperature
            prefix: "Freezer "
            suffix: "°"
            style:
              top: 88%
              left: 73%
              background: "rgba(137,180,250,0.12)"
              color: "#89b4fa"
              border: "1px solid rgba(137,180,250,0.35)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "12px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ── Avg Indoor (hall area — center of home) ───────────────────
          - type: state-label
            entity: sensor.avg_indoor_temp
            prefix: "Avg "
            suffix: "°"
            style:
              top: 56%
              left: 20%
              background: "rgba(137,180,250,0.13)"
              color: "#89b4fa"
              border: "1px solid rgba(137,180,250,0.35)"
              padding: "3px 9px"
              border-radius: "12px"
              font-size: "12px"
              font-weight: "700"
              pointer-events: none
              transform: translate(-50%,-50%)
              white-space: nowrap

          # ══════════════════════════════════════════════════════════════
          # LOCKS  — tap for more-info (color shows locked/unlocked)
          # ══════════════════════════════════════════════════════════════

          - type: state-icon
            entity: lock.front_door
            icon: mdi:lock
            tap_action:
              action: more-info
            style:
              top: 79%
              left: 43%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              cursor: pointer

          - type: state-icon
            entity: lock.front_door_2
            icon: mdi:lock
            tap_action:
              action: more-info
            style:
              top: 84%
              left: 43%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              cursor: pointer

          # ══════════════════════════════════════════════════════════════
          # ALARM
          # ══════════════════════════════════════════════════════════════

          - type: state-icon
            entity: alarm_control_panel.blink_marathon
            icon: mdi:shield-home
            tap_action:
              action: more-info
            style:
              top: 81%
              left: 49%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              cursor: pointer

          # Lock + alarm status label
          - type: custom:mushroom-template-card
            primary: >
              {% set l1 = states('lock.front_door') %}
              {% set l2 = states('lock.front_door_2') %}
              {% set a  = states('alarm_control_panel.blink_marathon') %}
              {{ '🔒' if l1=='locked' and l2=='locked' else '🔓 UNLOCKED' }}
              · {{ 'Armed' if a=='armed_away' else 'Disarmed' }}
            icon: ""
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  pointer-events: none;
                }
                .primary { font-size: 10px !important; color: #a6adc8 !important; }
            style:
              top: 91%
              left: 45%
              transform: translate(-50%,-50%)
              pointer-events: none

          # ══════════════════════════════════════════════════════════════
          # SWITCHES  — tap to toggle
          # ══════════════════════════════════════════════════════════════

          # ── Music Room: audio equipment ──────────────────────────────
          - type: state-icon
            entity: switch.musiccompandaudiostuff
            icon: mdi:music
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 42%
              left: 10%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#f9e2af"
              "--paper-item-icon-active-color": "#f9e2af"
              cursor: pointer

          # ── Living Room: clock wall grow light ───────────────────────
          - type: state-icon
            entity: switch.clock_wall_grow_light
            icon: mdi:flower
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 42%
              left: 62%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#a6e3a1"
              "--paper-item-icon-active-color": "#a6e3a1"
              cursor: pointer

          # ── Hallway: plant light ──────────────────────────────────────
          - type: state-icon
            entity: switch.living_room_hallway_plant_light
            icon: mdi:flower-tulip
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 56%
              left: 8%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#a6e3a1"
              "--paper-item-icon-active-color": "#a6e3a1"
              cursor: pointer

          # ── Kitchen: grow light ───────────────────────────────────────
          - type: state-icon
            entity: switch.kitchen_bench_grow_light
            icon: mdi:flower-pollen
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 72%
              left: 76%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#a6e3a1"
              "--paper-item-icon-active-color": "#a6e3a1"
              cursor: pointer

          # ── Master Bedroom: Krissy's PC ───────────────────────────────
          - type: state-icon
            entity: switch.krissy_pc_power_guarded
            icon: mdi:desktop-tower
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 68%
              left: 8%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#89b4fa"
              "--paper-item-icon-active-color": "#89b4fa"
              cursor: pointer

          # ── Master Bedroom: bedside grow light ────────────────────────
          - type: state-icon
            entity: switch.krissy_bedside_grow_light
            icon: mdi:flower-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 76%
              left: 15%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#a6e3a1"
              "--paper-item-icon-active-color": "#a6e3a1"
              cursor: pointer

          # ── Back Patio: patio light ───────────────────────────────────
          - type: state-icon
            entity: switch.patio_light_switch
            icon: mdi:outdoor-lamp
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            style:
              top: 17%
              left: 80%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              "--paper-item-icon-color": "#f9e2af"
              "--paper-item-icon-active-color": "#f9e2af"
              cursor: pointer

          # ══════════════════════════════════════════════════════════════
          # VACUUM
          # ══════════════════════════════════════════════════════════════

          - type: state-icon
            entity: vacuum.q5_max
            icon: mdi:robot-vacuum
            tap_action:
              action: more-info
            style:
              top: 56%
              left: 14%
              background: "rgba(17,17,27,0.85)"
              border-radius: "50%"
              padding: "7px"
              cursor: pointer

          # ══════════════════════════════════════════════════════════════
          # CONDITIONAL GLOWS — visible when switches are ON
          # These create a subtle "room is active" effect.
          # For full color-synced room fills, install ha-floorplan (HACS)
          # ══════════════════════════════════════════════════════════════

          # Music Room glow (music equipment on)
          - type: conditional
            conditions:
              - condition: state
                entity: switch.musiccompandaudiostuff
                state: "on"
            elements:
              - type: image
                image: /local/floorplan.svg   # placeholder — replace w/ glow overlay
                style:
                  top: 39%
                  left: 14.5%
                  width: "22%"
                  height: "20%"
                  background: "rgba(249,226,175,0.08)"
                  border-radius: "6px"
                  pointer-events: none
                  filter: "drop-shadow(0 0 12px rgba(249,226,175,0.4))"

          # Living Room glow (clock wall grow light on)
          - type: conditional
            conditions:
              - condition: state
                entity: switch.clock_wall_grow_light
                state: "on"
            elements:
              - type: state-badge
                entity: switch.clock_wall_grow_light
                style:
                  top: 34%
                  left: 62%
                  "--label-badge-background-color": "rgba(166,227,161,0.3)"
                  "--label-badge-text-color": "#a6e3a1"
                  "--label-badge-border-color": "rgba(166,227,161,0.6)"
                  filter: "drop-shadow(0 0 8px rgba(166,227,161,0.6))"
                  pointer-events: none

          # Kitchen glow
          - type: conditional
            conditions:
              - condition: state
                entity: switch.kitchen_bench_grow_light
                state: "on"
            elements:
              - type: state-badge
                entity: switch.kitchen_bench_grow_light
                style:
                  top: 64%
                  left: 76%
                  "--label-badge-background-color": "rgba(166,227,161,0.3)"
                  "--label-badge-text-color": "#a6e3a1"
                  "--label-badge-border-color": "rgba(166,227,161,0.6)"
                  filter: "drop-shadow(0 0 8px rgba(166,227,161,0.6))"
                  pointer-events: none

          # Master Bedroom glow (bedside grow light on)
          - type: conditional
            conditions:
              - condition: state
                entity: switch.krissy_bedside_grow_light
                state: "on"
            elements:
              - type: state-badge
                entity: switch.krissy_bedside_grow_light
                style:
                  top: 68%
                  left: 15%
                  "--label-badge-background-color": "rgba(166,227,161,0.3)"
                  "--label-badge-text-color": "#a6e3a1"
                  "--label-badge-border-color": "rgba(166,227,161,0.6)"
                  filter: "drop-shadow(0 0 8px rgba(166,227,161,0.6))"
                  pointer-events: none
